# /etc/keepalived/keepalived.conf on dns2 (192.168.1.62) - takes the floating IP when dns1 fails
global_defs {
    router_id dns2
    enable_script_security
    script_user root
}

vrrp_script chk_technitium {
    script "/etc/keepalived/check_technitium.sh"
    interval 2
    timeout 2
    fall 2
    rise 2
}

vrrp_instance DNS_VIP {
    state BACKUP
    interface eth0
    virtual_router_id 213
    priority 100
    advert_int 1
    unicast_src_ip 192.168.1.62
    unicast_peer {
        192.168.1.61
    }
    virtual_ipaddress {
        192.168.1.60/24
    }
    track_script {
        chk_technitium
    }
}
