# /etc/keepalived/keepalived.conf on dns1 (10.37.0.61) - normally holds the floating IP
global_defs {
    router_id dns1
    enable_script_security
    script_user root
}

vrrp_script chk_technitium {
    script "/etc/keepalived/check_technitium.sh"
    interval 2      # run every 2 seconds
    timeout 2
    fall 2          # 2 failures in a row = unhealthy
    rise 2          # 2 passes in a row = healthy again
}

vrrp_instance DNS_VIP {
    state MASTER
    interface eth0
    virtual_router_id 213     # any 1-255 not used by other VRRP on your LAN
    priority 150
    advert_int 1
    unicast_src_ip 10.37.0.61   # this server's IP: change to yours
    unicast_peer {
        10.37.0.62   # the other server's IP: change to yours
    }
    virtual_ipaddress {
        10.37.0.60/24   # the floating IP your devices use: pick a free IP in your network
    }
    track_script {
        chk_technitium
    }
}
